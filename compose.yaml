name: flashlab
services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: flashlab
      POSTGRES_PASSWORD: flashlab_local
      POSTGRES_DB: flashlab
    ports: ['127.0.0.1:5432:5432']
    volumes: ['flashlab-db:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flashlab -d flashlab']
      interval: 2s
      timeout: 3s
      retries: 20
  test-db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: flashlab
      POSTGRES_PASSWORD: flashlab_local
      POSTGRES_DB: flashlab_test
    ports: ['127.0.0.1:5433:5432']
    tmpfs: ['/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flashlab -d flashlab_test']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  flashlab-db:
